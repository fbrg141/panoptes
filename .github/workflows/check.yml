# Runs everything `pnpm check` runs on every pull request and on every push to
# main, in two jobs side by side: the UI checks on Linux (fast to start) and
# the Rust checks on macOS, since Panoptes is a macOS app. A real Pi is not
# needed: the adapter tests use crates/panoptes-pi/tests/fixtures/fake_pi.py.
name: Check

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the run it replaces.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ui:
    name: UI (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
