[workspace]
resolver = "3"
members = [
    "crates/panoptes-app",
    "crates/panoptes-core",
    "crates/panoptes-harness",
    "crates/panoptes-pi",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
# `if let ... && let ...` chains need Rust 1.88.
rust-version = "1.88"
license = "MIT"
authors = ["Uros Dimitrijevic"]
repository = "https://github.com/fbrg141/panoptes"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros", "time", "fs"] }
panoptes-harness = { path = "crates/panoptes-harness" }
panoptes-pi = { path = "crates/panoptes-pi" }
panoptes-core = { path = "crates/panoptes-core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
